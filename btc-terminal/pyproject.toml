[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btc-terminal"
version = "0.1.0"
description = "Live Gemini BTC five-minute prediction order book for your terminal"
requires-python = ">=3.12"
dependencies = ["textual==8.2.8", "httpx==0.28.1", "websockets==15.0.1"]

[project.scripts]
btc = "btc_terminal.app:main"

[tool.hatch.build.targets.wheel]
packages = ["btc_terminal"]
